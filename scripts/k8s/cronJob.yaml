apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello
spec:
  schedule: "* 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello
              image: cr.yandex/crpjhav5dledksn6gaeo/labkeeper-e2e:latest
              imagePullPolicy: Always
              env:
                - name: E2E_HOST
                  value: https://labkeeper.io
          restartPolicy: OnFailure
